<h2>Suppliers</h2>
<form (ngSubmit)="save()">
  <input name="name" placeholder="Name" [(ngModel)]="form.name" required>
  <input name="taxId" placeholder="Tax id" [(ngModel)]="form.taxId" required>
  <select name="state" [(ngModel)]="form.state" required>
    <option value="">State</option>
    @for (state of states; track state) {
      <option [value]="state">{{ state }}</option>
    }
  </select>
  <button type="submit">Save</button>
  <button type="button" (click)="clear()">Clear</button>
</form>
<table>
  <tr><th>Name</th><th>Tax id</th><th>State</th><th></th></tr>
  @for (supplier of suppliers; track supplier.id) {
    <tr>
      <td>{{ supplier.name }}</td><td>{{ supplier.taxId }}</td><td>{{ supplier.state }}</td>
      <td><button (click)="edit(supplier)">Edit</button> <button (click)="remove(supplier)">Delete</button></td>
    </tr>
  }
</table>
